# Blueprint Render: requer PostgreSQL gerenciado e DATABASE_URL configurada no painel.
services:
  - type: web
    name: pulso-social-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SETUP_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # RENDER_EXTERNAL_URL é fornecida automaticamente pelo Render
      # e usada pela aplicação como origem autorizada.
